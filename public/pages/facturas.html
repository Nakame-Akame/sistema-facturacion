<div class="page" id="page-facturas">
    <div class="table-card">
      <div class="tabs-bar" id="tabs-comprobantes">
        <!-- Las pestañas se generan dinámicamente en JS -->
      </div>
      <div class="table-header">
        <h2 id="comprobantes-titulo">Todos los comprobantes</h2>
        <div class="table-tools">
          <div class="search-bar"><input type="text" id="buscar-factura" placeholder="Cliente, DNI o RUC..." oninput="filtrarFacturas()"></div>
          <div class="dropdown">
            <button class="btn btn-primary" onclick="toggleDropdownNuevo()">+ Otros documentos ▾</button>
            <div class="dropdown-menu" id="dropdown-nuevo">
              <button class="dropdown-item" onclick="abrirModalFactura('nota_pedido')"><span class="dot" style="background:#f7c948"></span> Nota de pedido</button>
              <button class="dropdown-item" onclick="abrirModalFactura('guia_remision')"><span class="dot" style="background:#a78bfa"></span> Guía de remisión</button>
              <button class="dropdown-item" onclick="abrirModalFactura('cotizacion')"><span class="dot" style="background:#7a86a0"></span> Cotización</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_devolucion')"><span class="dot" style="background:#f06585"></span> Nota de devolución</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_credito_f')"><span class="dot" style="background:#38d9a9"></span> Nota de crédito (Factura)</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_credito_b')"><span class="dot" style="background:#4f8ef7"></span> Nota de crédito (Boleta)</button>
            </div>
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Comprobante</th><th>Cliente</th><th>Fecha</th><th>Cond. Pago</th><th>Subtotal</th><th>IGV</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="facturas-body">
          <tr><td colspan="9"><div class="empty"><span class="icon">🧾</span><p>No hay comprobantes aún</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
