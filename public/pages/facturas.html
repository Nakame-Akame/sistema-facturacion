<link rel="stylesheet" data-page-style href="/styles/facturas.css">
<div class="page" id="page-facturas">
    <div class="table-card">
      <div class="tabs-bar" id="tabs-comprobantes">
        <!-- Las pestañas se generan dinámicamente en JS -->
      </div>
      <div class="table-header">
        <h2 id="comprobantes-titulo">Todos los comprobantes</h2>
        <div class="table-tools">
          <div class="date-range-group" aria-label="Rango de fechas">
            <div class="date-field">
              <span>Desde</span>
              <div class="date-picker-input">
                <input class="date-trigger" id="fecha-desde" type="date" aria-label="Fecha inicial" oninput="filtrarFacturas()">
              </div>
            </div>
            <div class="date-field">
              <span>Hasta</span>
              <div class="date-picker-input">
                <input class="date-trigger" id="fecha-hasta" type="date" aria-label="Fecha final" oninput="filtrarFacturas()">
              </div>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" onclick="resetearFechas()">Limpiar</button>
          </div>
          <div class="search-bar"><input type="text" id="buscar-factura" placeholder="Cliente, DNI o RUC..." oninput="filtrarFacturas()"></div>
          <div class="dropdown">
            <button class="btn btn-primary" onclick="toggleDropdownNuevo()">+ Otros documentos ▾</button>
            <div class="dropdown-menu" id="dropdown-nuevo">
              <button class="dropdown-item" onclick="abrirModalFactura('nota_pedido')"><span class="dot dot--nota-pedido"></span> Nota de pedido</button>
              <button class="dropdown-item" onclick="abrirModalFactura('guia_remision')"><span class="dot dot--guia-remision"></span> Guía de remisión</button>
              <button class="dropdown-item" onclick="abrirModalFactura('cotizacion')"><span class="dot dot--cotizacion"></span> Cotización</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_devolucion')"><span class="dot dot--nota-devolucion"></span> Nota de devolución</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_credito_f')"><span class="dot dot--nota-credito-factura"></span> Nota de crédito (Factura)</button>
              <button class="dropdown-item" onclick="abrirModalFactura('nota_credito_b')"><span class="dot dot--nota-credito-boleta"></span> Nota de crédito (Boleta)</button>
            </div>
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Comprobante</th><th>Cliente</th><th>Fecha</th><th>Cond. Pago</th><th>Subtotal</th><th>IGV</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="facturas-body">
          <tr><td colspan="9"><div class="empty"><span class="icon">🧾</span><p>No hay comprobantes aún</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
