<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacturaPro — Sistema de Facturación</title>
<meta name="theme-color" content="#18312b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link id="base-stylesheet" rel="stylesheet" href="/Style.css">
</head>
<body>

<!-- ===== PANTALLA DE LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" aria-hidden="true">F</div>
    <h1>FacturaPro</h1>
    <p class="sub">Accede a tu espacio de trabajo</p>
    <div class="login-form">
      <div id="login-error"></div>
      <div>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="nombre@empresa.com" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <div>
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <button class="login-btn" id="login-btn" onclick="hacerLogin()">Iniciar sesión</button>
    </div>
  </div>
</div>

<!-- ===== APP (oculta hasta iniciar sesión) ===== -->
<div id="app-shell" class="u-hidden">

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-logo">
    <div class="brand-line"><span class="brand-mark">F</span><span class="brand-name">FacturaPro</span></div>
    <small>Gestión comercial</small>
  </div>
  <nav class="nav" aria-label="Navegación principal">
    <button class="nav-item active" onclick="goTo('dashboard')"><span class="icon">📊</span> Dashboard</button>
    <button class="nav-item" onclick="goTo('ventas')"><span class="icon">🛒</span> Ventas</button>
    <button class="nav-item" onclick="goTo('facturas')"><span class="icon">🧾</span> Comprobantes</button>
    <button class="nav-item" onclick="goTo('clientes')"><span class="icon">👥</span> Clientes</button>
    <button class="nav-item" onclick="goTo('productos')"><span class="icon">📦</span> Productos</button>
    <button class="nav-item" onclick="goTo('compras')"><span class="icon">📥</span> Compras</button>
    <button class="nav-item" onclick="goTo('reportes')"><span class="icon">📈</span> Reportes</button>
    <button class="nav-item u-hidden" id="nav-usuarios" onclick="goTo('usuarios')"><span class="icon">⚙</span> Usuarios</button>
  </nav>
  <div class="sidebar-footer">
    <p>FacturaPro v1.0</p>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-copy">
      <p class="topbar-kicker"><span>/</span> OPERACIONES</p>
      <h1 id="page-title">Dashboard</h1>
    </div>
    <div class="topbar-right">
      <span id="fecha-top" class="topbar-date"></span>
      <button class="btn btn-primary btn-new" onclick="goTo('ventas')"><span class="btn-plus">+</span><span class="btn-label">Nueva venta</span></button>
      <button class="user-pill u-hidden" id="user-pill" type="button" onclick="abrirModalPerfil()" aria-label="Editar perfil">
        <div class="avatar" id="user-avatar">A</div>
        <span id="user-nombre"></span>
        <span class="role-badge" id="user-rol"></span>
      </button>
      <button class="btn btn-ghost btn-sm btn-logout" onclick="cerrarSesion()"><span aria-hidden="true">↪</span><span class="btn-label">Salir</span></button>
    </div>
  </header>

  <!-- ===== DASHBOARD ===== -->
    <div id="page-views-root"></div>


</main>
    <div id="modal-root"></div>
</div><!-- /app-shell -->

<script>
(async () => {
  const pageNames = ["dashboard","ventas","facturas","clientes","productos","reportes","compras","usuarios"];
  const responses = await Promise.all([
    ...pageNames.map(name => fetch(`/pages/${name}.html`)),
    fetch('/pages/modals.html'),
  ]);
  if (responses.some(response => !response.ok))   throw new Error('No se pudieron cargar las secciones o sus estilos.');
  const fragments = await Promise.all(responses.map(response => response.text()));
  const stylesheetPromises = new Map();
  const preparedFragments = fragments.map(fragment => {
    const template = document.createElement('template');
    template.innerHTML = fragment;
    template.content.querySelectorAll('link[data-page-style]').forEach(link => {
      const href = link.href;
      if (!stylesheetPromises.has(href)) {
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = href;
        stylesheet.dataset.pageStyleLoaded = 'true';
        stylesheetPromises.set(href, new Promise((resolve, reject) => {
          stylesheet.addEventListener('load', resolve, { once: true });
          stylesheet.addEventListener('error', () => reject(new Error(`No se pudo cargar la hoja de estilos ${href}.`)), { once: true });
        }));
        document.head.insertBefore(stylesheet, document.getElementById('base-stylesheet'));
      }
      link.remove();
    });
    return template.innerHTML;
  });
  await Promise.all(stylesheetPromises.values());
  document.getElementById('page-views-root').innerHTML = preparedFragments.slice(0, pageNames.length).join('\n');
  document.getElementById('modal-root').innerHTML = preparedFragments[pageNames.length];
  const application = document.createElement('script');
  application.src = '/app.js';
  document.body.append(application);
})().catch(error => {
  console.error(error);
  const loginError = document.getElementById('login-error');
  if (loginError) {
    loginError.textContent = 'No se pudieron cargar las secciones o sus estilos. Recarga la página.';
    loginError.style.display = 'block';
  }
});
</script>
</body>
</html>
