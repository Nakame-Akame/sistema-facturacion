<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacturaPro — Sistema de Facturación</title>
<meta name="theme-color" content="#18312b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --card:      #1e2333;
    --border:    #2a3045;
    --accent:    #4f8ef7;
    --accent2:   #38d9a9;
    --danger:    #f06585;
    --warn:      #f7c948;
    --text:      #e8eaf0;
    --muted:     #7a86a0;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
    --radius:    10px;
    --transition: 0.18s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* SIDEBAR */
  .sidebar {
    width: 220px; min-height: 100vh; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo span {
    font-size: 18px; font-weight: 700; color: var(--accent);
    letter-spacing: -0.5px;
  }
  .sidebar-logo small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
  .nav { padding: 16px 10px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--muted);
    transition: all var(--transition); margin-bottom: 2px;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--card); color: var(--text); }
  .nav-item.active { background: rgba(79,142,247,0.15); color: var(--accent); }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
  .sidebar-footer p { font-size: 11px; color: var(--muted); }

  /* MAIN */
  .main { margin-left: 220px; flex: 1; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }

  /* PAGES */
  .page { display: none; padding: 28px; }
  .page.active { display: block; }

  /* CARDS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.blue::before { background: var(--accent); }
  .stat-card.green::before { background: var(--accent2); }
  .stat-card.red::before { background: var(--danger); }
  .stat-card.yellow::before { background: var(--warn); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 700; font-family: var(--mono); }
  .stat-value.blue { color: var(--accent); }
  .stat-value.green { color: var(--accent2); }
  .stat-value.red { color: var(--danger); }
  .stat-value.yellow { color: var(--warn); }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* TABLE */
  .table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .table-header h2 { font-size: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(42,48,69,0.5); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(79,142,247,0.04); }
  .mono { font-family: var(--mono); font-size: 12px; }

  /* BADGES */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: rgba(56,217,169,0.15); color: var(--accent2); }
  .badge-blue { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-red { background: rgba(240,101,133,0.15); color: var(--danger); }
  .badge-yellow { background: rgba(247,201,72,0.15); color: var(--warn); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all var(--transition); font-family: var(--sans); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a7de8; }
  .btn-success { background: var(--accent2); color: #0f1117; }
  .btn-success:hover { background: #2bc49a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #e04570; }
  .btn-ghost { background: var(--border); color: var(--text); }
  .btn-ghost:hover { background: #3a4060; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* FORMS */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; color: var(--text); font-size: 13.5px; font-family: var(--sans);
    transition: border-color var(--transition); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--card); }

  /* SEARCH BAR */
  .search-bar { position: relative; }
  .search-bar input { padding-left: 34px; width: 220px; }
  .search-bar::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 90%; max-width: 580px; max-height: 90vh; overflow-y: auto;
    padding: 28px; position: relative;
  }
  .modal-lg { max-width: 760px; }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }

  /* FACTURA ITEMS */
  .items-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .item-row { display: grid; grid-template-columns: 2fr 80px 100px 36px; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); align-items: center; }
  .item-row:last-child { border-bottom: none; }
  .item-row.header { background: rgba(0,0,0,0.2); font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .items-total { background: rgba(79,142,247,0.08); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .total-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .total-row.final { font-size: 16px; font-weight: 700; color: var(--accent2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ALERT */
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .alert-info { background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3); color: var(--accent); }
  .alert-warn { background: rgba(247,201,72,0.1); border: 1px solid rgba(247,201,72,0.3); color: var(--warn); }
  .alert-danger { background: rgba(240,101,133,0.1); border: 1px solid rgba(240,101,133,0.3); color: var(--danger); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 20px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateY(80px);
    opacity: 0; transition: all 0.3s ease; max-width: 320px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: var(--accent2); color: var(--accent2); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* DIVIDER */
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; margin-top: 24px; }

  /* FACTURA PREVIEW */
  .factura-preview { background: #fff; color: #111; border-radius: 8px; padding: 32px; font-size: 13px; line-height: 1.6; }
  .fp-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
  .fp-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .fp-num { font-family: var(--mono); font-size: 14px; color: #4f8ef7; font-weight: 700; }
  .fp-section { margin-bottom: 16px; }
  .fp-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #888; font-weight: 600; }
  .fp-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  .fp-table th { background: #f0f4ff; padding: 8px 12px; font-size: 11px; text-align: left; }
  .fp-table td { padding: 8px 12px; border-bottom: 1px solid #eee; }
  .fp-totals { margin-left: auto; width: 240px; }
  .fp-total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .fp-total-row.final { font-weight: 700; font-size: 16px; border-top: 2px solid #1a1a2e; padding-top: 8px; margin-top: 4px; }

  .actions-group { display: flex; gap: 6px; }
  .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sales-page-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .sales-layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(310px,.85fr); gap:16px; align-items:start; }
  .sales-catalog { min-width:0; }
  .sales-checkout { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; position:sticky; top:88px; }
  .sales-checkout h2 { font-size:16px; margin-bottom:4px; }
  .sales-subtitle { color:var(--muted); font-size:12px; }
  .sales-type-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--bg); border:1px solid var(--border); border-radius:8px; margin:16px 0; }
  .sales-type-button { border:0; border-radius:5px; background:transparent; color:var(--muted); padding:9px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .sales-type-button.active { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .sales-field { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  .sales-client-search { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; }
  .sales-client-search input, .sales-field select { width:100%; }
  .sales-stock { color:var(--muted); font-size:11px; }
  .sales-add-controls { display:flex; align-items:center; gap:6px; }
  .sales-quantity { width:72px; min-width:0; padding:6px 7px; }
  .sales-cart-list { display:grid; gap:8px; margin:12px 0; max-height:260px; overflow:auto; }
  .sales-cart-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .sales-cart-name { font-size:12px; font-weight:600; overflow-wrap:anywhere; }
  .sales-cart-meta { color:var(--muted); font-size:11px; margin-top:2px; }
  .sales-summary { border-top:1px solid var(--border); padding-top:10px; }
  .sales-summary .total-row.final { color:var(--accent2); }
  .sales-submit { width:100%; justify-content:center; margin-top:14px; }
  @media (max-width: 1050px) { .sales-layout { grid-template-columns:minmax(0,1fr) minmax(280px,.8fr); } }
  @media (max-width: 820px) { .sales-layout { grid-template-columns:1fr; } .sales-checkout { position:static; } }
  @media (max-width: 560px) { .sales-page-head { align-items:flex-start; flex-direction:column; } .sales-client-search { grid-template-columns:1fr; } }

  /* LOGIN */
  #login-screen {
    display: flex; position: fixed; inset: 0; z-index: 9999;
    background:
      radial-gradient(circle at 20% 20%, rgba(79,142,247,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(56,217,169,0.08), transparent 40%),
      var(--bg);
    align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px; width: 380px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .login-logo { font-size: 30px; margin-bottom: 6px; }
  .login-box h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
  .login-box .sub { color: var(--muted); font-size: 13px; margin-bottom: 26px; }
  .login-form { text-align: left; display: flex; flex-direction: column; gap: 14px; }
  .login-form label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .login-form input { width: 100%; margin-top: 6px; }
  #login-error { display: none; background: rgba(240,101,133,0.1); border: 1px solid rgba(240,101,133,0.3); color: var(--danger); font-size: 12.5px; text-align: center; padding: 9px; border-radius: 7px; }
  .login-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .login-btn:hover { background: #3a7de8; }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-hint { margin-top: 20px; font-size: 11px; color: #4a5268; }
  .login-loader { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }

  .user-pill { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 0 4px; }
  .user-pill .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .user-pill .role-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: rgba(79,142,247,0.15); color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }

  /* TABS de tipo de comprobante */
  .tabs-bar { display: flex; gap: 4px; padding: 14px 20px 0; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .tab-item {
    background: none; border: none; color: var(--muted); font-size: 12.5px; font-weight: 500;
    padding: 8px 14px; border-radius: 7px 7px 0 0; cursor: pointer; transition: all var(--transition);
    border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
  }
  .tab-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .tab-item.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(79,142,247,0.06); }
  .tab-count { font-size: 10px; background: var(--border); color: var(--muted); padding: 1px 6px; border-radius: 10px; }
  .tab-item.active .tab-count { background: var(--accent); color: #fff; }

  /* Dropdown "Nuevo comprobante" */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    min-width: 240px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); z-index: 60; overflow: hidden;
  }
  .dropdown-menu.open { display: block; }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    font-size: 13px; color: var(--text); cursor: pointer; transition: background var(--transition);
    border: none; background: none; width: 100%; text-align: left;
  }
  .dropdown-item:hover { background: rgba(79,142,247,0.08); }
  .dropdown-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
</style>

</head>
<body>

<!-- ===== PANTALLA DE LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" aria-hidden="true">F</div>
    <h1>FacturaPro</h1>
    <p class="sub">Accede a tu espacio de trabajo</p>
    <div class="login-form">
      <div id="login-error"></div>
      <div>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="nombre@empresa.com" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <div>
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <button class="login-btn" id="login-btn" onclick="hacerLogin()">Iniciar sesión</button>
    </div>
  </div>
</div>

<!-- ===== APP (oculta hasta iniciar sesión) ===== -->
<div id="app-shell" style="display:none;">

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-logo">
    <div class="brand-line"><span class="brand-mark">F</span><span class="brand-name">FacturaPro</span></div>
    <small>Gestión comercial</small>
  </div>
  <nav class="nav" aria-label="Navegación principal">
    <button class="nav-item active" onclick="goTo('dashboard')"><span class="icon">📊</span> Dashboard</button>
    <button class="nav-item" onclick="goTo('ventas')"><span class="icon">🛒</span> Ventas</button>
    <button class="nav-item" onclick="goTo('facturas')"><span class="icon">🧾</span> Comprobantes</button>
    <button class="nav-item" onclick="goTo('clientes')"><span class="icon">👥</span> Clientes</button>
    <button class="nav-item" onclick="goTo('productos')"><span class="icon">📦</span> Productos</button>
    <button class="nav-item" onclick="goTo('compras')"><span class="icon">📥</span> Compras</button>
    <button class="nav-item" onclick="goTo('reportes')"><span class="icon">📈</span> Reportes</button>
    <button class="nav-item" id="nav-usuarios" onclick="goTo('usuarios')" style="display:none;"><span class="icon">⚙</span> Usuarios</button>
  </nav>
  <div class="sidebar-footer">
    <p>FacturaPro v1.0</p>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-copy">
      <p class="topbar-kicker"><span>/</span> OPERACIONES</p>
      <h1 id="page-title">Dashboard</h1>
    </div>
    <div class="topbar-right">
      <span id="fecha-top" class="topbar-date"></span>
      <button class="btn btn-primary btn-new" onclick="goTo('ventas')"><span class="btn-plus">+</span><span class="btn-label">Nueva venta</span></button>
      <div class="user-pill" id="user-pill" style="display:none;">
        <div class="avatar" id="user-avatar">A</div>
        <span id="user-nombre"></span>
        <span class="role-badge" id="user-rol"></span>
      </div>
      <button class="btn btn-ghost btn-sm btn-logout" onclick="cerrarSesion()"><span aria-hidden="true">↪</span><span class="btn-label">Salir</span></button>
    </div>
  </header>

  <!-- ===== DASHBOARD ===== -->
    <div id="page-views-root"></div>


</main>
    <div id="modal-root"></div>
</div><!-- /app-shell -->

<script>
(async () => {
  const pageNames = ["dashboard","ventas","facturas","clientes","productos","reportes","compras","usuarios"];
  const responses = await Promise.all([
    ...pageNames.map(name => fetch(`/pages/${name}.html`)),
    fetch('/pages/modals.html'),
  ]);
  if (responses.some(response => !response.ok)) throw new Error('No se pudieron cargar las secciones de la aplicación.');
  const fragments = await Promise.all(responses.map(response => response.text()));
  document.getElementById('page-views-root').innerHTML = fragments.slice(0, pageNames.length).join('\n');
  document.getElementById('modal-root').innerHTML = fragments[pageNames.length];
  const application = document.createElement('script');
  application.src = '/app.js';
  document.body.append(application);
})().catch(error => {
  console.error(error);
  const loginError = document.getElementById('login-error');
  if (loginError) {
    loginError.textContent = 'No se pudieron cargar las secciones. Recarga la página.';
    loginError.style.display = 'block';
  }
});
</script>
</body>
</html>
